{% extends 'base.html' %}

{% block content %}

<div class="container py-5">

    <div class="alert alert-danger text-center p-5 shadow-sm">
        <h1 class="fw-bold mb-3">500 — Internal Server Error</h1>
        <p class="mb-4">
            Something went wrong on our end. Our team has been notified.
        </p>

        <!-- Back to Dashboard Button -->
        <a href="{{ url_for('main.index') }}" 
           class="btn btn-primary btn-lg mb-4">
            ← Back to Dashboard
        </a>

        <!-- Search Form -->
        <form action="{{ url_for('main.index') }}" method="GET" 
              class="d-flex justify-content-center mt-3"
              style="max-width: 500px; margin: 0 auto;">
            
            <input type="text" 
                   name="search" 
                   class="form-control form-control-lg me-2" 
                   placeholder="Search earthquakes by location...">

            <button class="btn btn-outline-light btn-lg bg-dark" type="submit">
                Search
            </button>
        </form>
    </div>

</div>

{% endblock %}
